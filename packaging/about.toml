# cargo-about configuration: THIRD-PARTY-NOTICES lists every crate that ships in the binaries.
#   cargo install cargo-about --features cli
#   cargo about generate packaging/about.hbs -c packaging/about.toml > THIRD-PARTY-NOTICES
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
