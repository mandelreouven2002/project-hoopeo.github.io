<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hoopeo Studio</title>
<style>
  * { box-sizing: border-box; border-radius: 0 !important; }
  html, body { margin: 0; height: 100%; background: #ffffff; overflow: hidden; cursor: default; user-select: none; }
  body { font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; color: #1d2433; }
  .splash { position: absolute; inset: 0; border: 1px solid #9aa3b2; display: grid; grid-template-rows: 1fr auto auto; }
  .brand { display: flex; align-items: center; justify-content: center; padding: 36px 48px 12px; }
  .brand img { width: 100%; max-width: 500px; height: auto; display: block; }
  .product { display: flex; justify-content: space-between; align-items: baseline; padding: 0 48px 14px; }
  .product .name { font-size: 15px; font-weight: 600; letter-spacing: 0.01em; color: #01183a; }
  .product .ver { color: #5b6476; font-variant-numeric: tabular-nums; }
  .bar { height: 3px; margin: 0 48px; background: #e6e9ef; overflow: hidden; position: relative; }
  .bar::after { content: ""; position: absolute; top: 0; bottom: 0; width: 30%; background: #1456c8; animation: run 1.1s linear infinite; }
  @keyframes run { from { left: -30%; } to { left: 100%; } }
  .foot { display: flex; justify-content: space-between; padding: 12px 48px 16px; color: #5b6476; border-top: 0; }
  .status { color: #3a4458; }
  @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; left: 0; width: 100%; } }
</style>
</head>
<body>
<div class="splash">
  <div class="brand"><img src="img/wordmark.png" alt="Project Hoopeo, Database-Enforced Privacy"></div>
  <div>
    <div class="product"><span class="name">Hoopeo Studio</span><span class="ver" id="ver">Version 0.5.0</span></div>
    <div class="bar" aria-hidden="true"></div>
  </div>
  <div class="foot"><span class="status" id="status">Starting DEP Engine...</span><span>(c) Reuven Mandelovich, lp.reuven.click</span></div>
</div>
<script src="splash.js"></script>
</body>
</html>
