[package]
name = "hoopeo-studio"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish = false
license = "LicenseRef-Hoopeo-Evaluation"
description = "Hoopeo Studio: the developer application for DEP SQL (Project Hoopeo)"

[features]
# Serve the UI embedded in the binary, as a release build must (the Tauri CLI turns this on itself).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
dirs = "6"
dep-engine = { path = "../engine" }
