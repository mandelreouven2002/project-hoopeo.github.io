[package]
name = "dep-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false
license = "BUSL-1.1"
description = "DEP Engine: a database server with Database-Enforced Privacy, on Apache DataFusion (Project Hoopeo)"

[lib]
name = "dep_engine"
path = "src/lib.rs"

[[bin]]
name = "dep-engine"
path = "src/bin/dep-engine.rs"

[dependencies]
datafusion = { version = "55.2.0", default-features = false, features = ["sql", "nested_expressions", "datetime_expressions", "unicode_expressions", "string_expressions", "regex_expressions", "crypto_expressions"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "io-util", "time"] }
async-trait = "0.1"
hmac = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
pgwire = { version = "0.42", default-features = false, features = ["server-api-ring", "pg-type-chrono"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
futures = "0.3"
md5 = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
redb = "4"
libc = "0.2"
bytes = "1"
tokio-rustls = { version = "0.26", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
