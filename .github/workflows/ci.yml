# Builds and tests Project Hoopeo on every push and pull request. release.yml runs it first.
name: ci

on:
  push:
    paths-ignore: ["site/**", "docs/**", "github-pages/**", "starter/**", "downloads/**", "**.md"]
  pull_request:
    paths-ignore: ["site/**", "docs/**", "github-pages/**", "starter/**", "downloads/**", "**.md"]
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: {}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for Hoopeo Studio
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - run: cargo test --locked -p dep-engine
      - run: cargo build --locked -p dep-cli -p hoopeo-studio

  compat:
    name: DEP.js against DEP Engine
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: {}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cargo build --release --locked -p dep-engine
      - name: The playground's own tests
        working-directory: playground
        run: npm ci && npm test
      - name: Start DEP Engine with the demo clinic
        run: |
          target/release/dep-engine --http-listen 127.0.0.1:8433 --init examples/clinic.sql --admin-password admin > engine.log 2>&1 &
          for i in $(seq 1 50); do curl -sf http://127.0.0.1:8433/v1/health && break; sleep 0.2; done
      - name: Compare DEP.js with DEP Engine (fails if any result differs)
        working-directory: playground
        env:
          DEP_ENGINE_URL: http://127.0.0.1:8433
          DEP_ADMIN_PASSWORD: admin
        run: npm run compat
      - if: failure()
        run: cat engine.log
